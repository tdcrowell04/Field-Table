<title>Field Table Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field desk at night, phone first. The sand table fills the top of the screen; the net, the squad, the brief, and the dice sit under it in tabs, with the order box pinned at the bottom. On a wide screen the table takes the left and the desk the right. One dark look, on purpose, matching the figures page. */
:root {
  color-scheme: dark;
  --bg: #191b16;
  --panel: #22251e;
  --panel-2: #2b2f25;
  --line: #3a3f32;
  --fg: #e7e1cf;
  --muted: #a39e8a;
  --sand: #d4b46a;
  --ink: #1b1a14;
  --friend: #78aee0;
  --enemy: #e2675c;
  --civ: #efe9da;
  --tracer: #ffd166;
  --good: #8fc27a;
  --warn: #e0a24f;
  --display: "Big Shoulders Stencil Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); }
body { color: var(--fg); font: 15px/1.45 var(--body); margin: 0; overflow: hidden; }
button, textarea { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }

.app {
  height: 100%; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 10px;
  display: grid; gap: 8px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(180px, 52fr) minmax(0, 48fr) auto;
  grid-template-areas: "top" "table" "desk" "orders";
}
.top { grid-area: top; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.top h1 { margin: 0; font: 800 24px/1 var(--display); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--sand); white-space: nowrap; }
.clock { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.table { grid-area: table; position: relative; min-height: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #11120e; }
.table canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.table canvas:active { cursor: grabbing; }
.zoom { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
.tbtn {
  min-width: 36px; height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line);
  background: rgba(25, 27, 22, .86); color: var(--fg); font: 500 15px/1 var(--mono); cursor: pointer;
}
.tbtn:hover { background: var(--panel-2); }
.tbtn[aria-pressed="true"] { background: var(--sand); color: var(--ink); border-color: var(--sand); }
.card {
  position: absolute; top: 8px; left: 8px; max-width: min(250px, calc(100% - 70px));
  background: rgba(25, 27, 22, .92); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px 10px;
  display: flex; flex-direction: column; gap: 4px; font-size: 13px;
}
.card .nm { font-weight: 600; font-size: 15px; line-height: 1.2; }
.card .meta { color: var(--muted); line-height: 1.35; }
.card .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.card .row button { font: 500 12px/1 var(--mono); padding: 7px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
.card .row button.primary { background: var(--sand); color: var(--ink); border-color: var(--sand); }
.playbar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: rgba(25, 27, 22, .9); border: 1px solid var(--line); border-radius: 8px; padding: 5px; }
.playbar .t { font: 500 12px/1 var(--mono); color: var(--muted); padding: 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dice { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; max-width: calc(100% - 70px); }
.die { display: flex; gap: 8px; align-items: center; background: rgba(25, 27, 22, .92); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: 12px/1.3 var(--mono); animation: pop .25s ease-out; }
.die b { font: 800 20px/1 var(--display); min-width: 30px; text-align: center; padding: 3px 4px; border-radius: 4px; background: var(--fg); color: var(--ink); }
.die.ok b { background: var(--good); } .die.bad b { background: var(--enemy); }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } }
.banner { position: absolute; inset: auto 12px 50% 12px; transform: translateY(50%); text-align: center; background: rgba(25, 27, 22, .94); border: 1px solid var(--sand); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.banner h2 { margin: 0; font: 800 32px/1 var(--display); letter-spacing: .03em; }
.banner p { margin: 0; color: var(--muted); }
.banner .rating { font: 800 48px/1 var(--display); letter-spacing: .04em; color: var(--sand); }
.banner .rating small { display: block; font: 500 11px/1.6 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.boot { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; text-align: center; padding: 20px; background: #11120e; }
.boot h2 { margin: 0; font: 800 30px/1 var(--display); letter-spacing: .04em; }
.boot p { margin: 0; color: var(--muted); max-width: 34ch; }
.boot .bar { width: min(220px, 70%); height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.boot .bar i { display: block; height: 100%; width: 30%; background: var(--sand); animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.desk { grid-area: desk; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; background: none; border: 0; padding: 10px 6px 9px; font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--sand); border-bottom-color: var(--sand); }
.tabs .count { font-variant-numeric: tabular-nums; color: var(--fg); }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 12px; }

.net { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.net li { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 8px; font: 13px/1.4 var(--mono); padding: 3px 0; }
.net .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.net .who { color: var(--friend); font-weight: 500; }
.net li.you .who { color: var(--sand); }
.net li.you .x { color: var(--fg); }
.net li.event .x { color: var(--muted); }
.net li.bad .x { color: var(--enemy); }
.net li.warn .x { color: var(--warn); }
.net li.turn { grid-template-columns: minmax(0, 1fr); color: var(--muted); border-top: 1px solid var(--line); margin-top: 6px; padding-top: 7px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }

.squad { display: flex; flex-direction: column; gap: 12px; }
.team h3, .mini { margin: 0 0 5px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--sand); }
.mate { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 9px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 5px; padding: 6px 6px; cursor: pointer; }
.mate:hover, .mate[aria-pressed="true"] { background: var(--panel-2); }
.mate .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--friend); box-sizing: border-box; align-self: center; }
.mate .dot.wounded { border-color: var(--warn); background: var(--warn); }
.mate .dot.down { border-color: var(--enemy); background: var(--enemy); }
.mate .dot.dead { border-color: var(--muted); background: var(--muted); }
.mate .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mate .n small { font-weight: 400; color: var(--muted); font-size: 13px; }
.mate .a { font: 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.mate .o { grid-column: 2 / 4; font: 12px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.brief { display: flex; flex-direction: column; gap: 12px; max-width: 68ch; }
.brief h2 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: .03em; text-wrap: balance; }
.brief ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.brief p { margin: 0; color: var(--muted); }
.brief .says { font: 13px/1.5 var(--mono); color: var(--fg); background: var(--panel-2); border-radius: 6px; padding: 8px 10px; }
.brief .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.obj { display: flex; flex-direction: column; gap: 4px; }
.obj .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.obj .mark { font: 600 14px/1 var(--mono); text-align: center; }
.obj .chip { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; border: 1px solid currentColor; color: var(--muted); white-space: nowrap; }
.obj .ok .mark, .obj .ok .chip { color: var(--muted); }
.obj .met .mark, .obj .met .chip { color: var(--good); }
.obj .failed .mark, .obj .failed .chip { color: var(--enemy); }
.obj .onit .mark, .obj .onit .chip { color: var(--sand); }
.obj.main .row > span:nth-child(2) { font-weight: 600; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; }
.facts dt { font: 500 11px/1.9 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--sand); }
.facts dd { margin: 0; }
.grades { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.grades .met { color: var(--good); } .grades .failed { color: var(--enemy); }

.rolls { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rolls li { display: grid; grid-template-columns: 50px minmax(0, 1fr) 40px; gap: 8px; font: 12px/1.35 var(--mono); padding: 3px 0; align-items: baseline; }
.rolls .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.rolls .r { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.rolls .r.ok { color: var(--good); } .rolls .r.bad { color: var(--enemy); }
.rolls li.big .x { color: var(--fg); } .rolls li:not(.big) .x { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; }

.preview { display: flex; flex-direction: column; gap: 8px; }
.ocard { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
.ocard .h { font-weight: 600; }
.ocard .h small { font: 12px/1 var(--mono); color: var(--muted); font-weight: 400; margin-left: 6px; }
.ocard .rb { font: 13px/1.4 var(--mono); color: var(--friend); }
.ocard ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font: 12px/1.35 var(--mono); }
.ocard li.ok { color: var(--muted); } .ocard li.ok::before { content: "✓ "; color: var(--good); }
.ocard li.no { color: var(--enemy); } .ocard li.no::before { content: "✗ "; }
.ocard li.warn { color: var(--warn); } .ocard li.warn::before { content: "! "; }
.ocard.say { border-color: var(--warn); }
.ocard.nc { border-style: dashed; }

.orders { grid-area: orders; display: flex; gap: 8px; align-items: flex-end; }
.orders textarea {
  flex: 1; min-width: 0; resize: none; box-sizing: border-box; height: 44px; max-height: 120px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; font-size: 16px; line-height: 1.3;
}
.orders textarea::placeholder { color: var(--muted); }
.btn { height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--sand); border-color: var(--sand); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { height: 34px; padding: 0 11px; font-size: 14px; }

@media (min-aspect-ratio: 1/1) {
  .app {
    grid-template-columns: minmax(0, 1fr) clamp(280px, 42%, 400px);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "table desk" "table orders";
  }
}
@media (min-aspect-ratio: 1/1) and (min-height: 600px) { .app { padding-block: 14px; } }
@media (min-aspect-ratio: 1/1) and (max-height: 520px) {
  .app { gap: 6px; padding-block: 6px; }
  .top h1 { font-size: 20px; }
  .top .eyebrow { display: none; }
  .tabs button { padding-block: 8px 7px; }
  .pane { padding-block: 8px; }
}
@media (max-width: 420px) { .top .eyebrow { display: none; } }
@media (prefers-reduced-motion: reduce) { .die, .boot .bar i { animation: none; } }
</style>

<div class="app">
  <header class="top">
    <span class="eyebrow">Field Table · playtest</span>
    <h1 id="title">Field Table</h1>
    <span class="clock" id="clock">Loading</span>
  </header>

  <div class="table" id="tableBox">
    <canvas id="cv" aria-label="The sand table: drag to move, pinch or scroll to zoom, tap a Marine to select, tap the ground to name a spot"></canvas>
    <div class="zoom">
      <button class="tbtn" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="tbtn" id="zout" type="button" aria-label="Zoom out">−</button>
      <button class="tbtn" id="zfit" type="button" aria-label="Show the whole map">⤢</button>
    </div>
    <div class="card" id="card" hidden></div>
    <div class="dice" id="dice" aria-live="polite"></div>
    <div class="playbar" id="playbar" hidden>
      <button class="tbtn" id="ppause" type="button">Pause</button>
      <button class="tbtn" data-speed="2" type="button">2×</button>
      <button class="tbtn" data-speed="4" type="button">4×</button>
      <button class="tbtn" data-speed="8" type="button">8×</button>
      <span class="t" id="ptime">0:00</span>
      <button class="tbtn" id="pskip" type="button">Skip</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="boot" id="boot">
      <h2>Field Table</h2>
      <p id="bootMsg">Loading the simulation. It's about 11 MB, so the first load takes a moment.</p>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <section class="desk" aria-label="The desk">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="net" aria-selected="true">Net</button>
      <button type="button" role="tab" data-tab="squad" aria-selected="false">Squad</button>
      <button type="button" role="tab" data-tab="brief" aria-selected="false">Brief</button>
      <button type="button" role="tab" data-tab="dice" aria-selected="false">Dice</button>
    </div>
    <div class="pane" id="pane" role="tabpanel" tabindex="0"></div>
  </section>

  <form class="orders" id="orderForm" autocomplete="off">
    <textarea id="orderBox" rows="1" placeholder="Type orders" aria-label="Orders to the squad"></textarea>
    <button class="btn" id="sendBtn" type="submit" disabled>Send</button>
    <button class="btn primary" id="playBtn" type="button" disabled>Play turn</button>
  </form>
</div>

<script>
(() => {
  "use strict";
  // ================================================================== the figures, from the figures page (field-table-figures.html)
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const H = (a, b) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    return "rgb(" + Math.round((n >> 16 & 255) * f) + "," + Math.round((n >> 8 & 255) * f) + "," + Math.round((n & 255) * f) + ")";
  }
  const COL = { friend: "#78aee0", enemy: "#e2675c", civ: "#efe9da", tracer: "#ffd166" };
  const css = getComputedStyle(document.documentElement);
  const FD = css.getPropertyValue("--display").trim(), FM = css.getPropertyValue("--mono").trim(), FB = css.getPropertyValue("--body").trim();

  // ------------------------------------------------------------------ camo and colors
  function camo(cols, seed) {
    const N = 40, c = document.createElement("canvas"); c.width = c.height = N;
    const x = c.getContext("2d"), r = rng(seed);
    const waves = Array.from({ length: 5 }, () => ({ fx: 1 + Math.floor(r() * 3), fy: 1 + Math.floor(r() * 3), sx: r() < 0.5 ? 1 : -1, ph: r() * 6.283, a: 0.6 + r() * 0.6 }));
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      let v = 0; waves.forEach(w => { v += w.a * Math.sin(6.283 * (w.sx * w.fx * i + w.fy * j) / N + w.ph); });
      v = v / 2.2 + (r() - 0.5) * 0.9;
      x.fillStyle = cols[v < -0.55 ? 3 : v < -0.05 ? 2 : v < 0.45 ? 0 : 1]; x.fillRect(i, j, 1, 1);
    }
    return c;
  }
  const CAMO = { dry: camo(["#c2ad86", "#a48d68", "#87704f", "#62513c"], 7), green: camo(["#6e7350", "#4d5536", "#64543c", "#2b2a22"], 7) };
  const CAMO_AVG = { dry: "#a48d68", green: "#5d6143" };
  const PATS = new WeakMap();
  function pat(ctx, canvas) {
    let m = PATS.get(ctx); if (!m) PATS.set(ctx, m = new Map());
    let p = m.get(canvas); if (!p) { p = ctx.createPattern(canvas, "repeat"); m.set(canvas, p); }
    return p;
  }
  const INK_DAY = { gun: "#232323", wood: "#7b4a29", olive: "#4b5132", tube: "#5c5b3b", tip: "#4f4a2e", box: "#4a4a3a", pouch: "#66583f", pad: "#34332e", radio: "#4b4636", ant: "#3a372c", bag: "#6a5c42", med: "#5f6a45", drone: "#2a2b2d", screen: "#86c3e6", eye: "#1c2023", cup: "#5e5444", nvg: "#1f1f1d", far: "rgba(0,0,0,0.22)", flash: "#ffcf73", flashCore: "#fff5dc", shadow: "rgba(0,0,0,0.28)" };
  const INK_IR = { gun: "#7a7a7a", wood: "#8d8d8d", olive: "#8a8a8a", tube: "#8e8e8e", tip: "#8a8a8a", box: "#8a8a8a", pouch: "#a3a3a3", pad: "#b5b5b5", radio: "#bdbdbd", ant: "#9a9a9a", bag: "#adadad", med: "#b0b0b0", drone: "#d8d8d8", screen: "#f4f4f4", eye: "#e2e2e2", cup: "#cfcfcf", nvg: "#9a9a9a", far: "rgba(0,0,0,0.12)", flash: "#ffffff", flashCore: "#ffffff", shadow: "rgba(0,0,0,0)" };
  let INK = INK_DAY;
  const THERM = { shirt: "#d2d2d2", pants: "#c6c6c6", vest: "#aaaaaa", headC: "#bebebe", boots: "#9a9a9a", skin: "#ffffff", glove: "#e8e8e8", camo: null };

  // ------------------------------------------------------------------ the figures
  const MARINES = {
    sl:  { name: "Squad leader", line: "M27 rifle and the squad radio", weapon: "m27", skin: "#c99a73", radio: true },
    tl:  { name: "Team leader", line: "M27 with a grenade launcher; leads a team of four", weapon: "m27g", skin: "#8d5b3c" },
    ar:  { name: "Automatic rifleman", line: "M27 with a bipod, fires in bursts", weapon: "m27b", skin: "#b07a55" },
    aar: { name: "Assistant automatic rifleman", line: "M27 and the team's spare magazines", weapon: "m27", skin: "#6b4430", pack: true },
    rf:  { name: "Rifleman", line: "M27 rifle", weapon: "m27", skin: "#e0b996" },
    dr:  { name: "Drone operator", line: "A rifleman trained to fly the squad's attack drones", weapon: "m27", skin: "#a8774f", drone: true },
    doc: { name: "Corpsman", line: "M4 carbine and an aid bag; Navy, with the platoon", weapon: "m4", skin: "#d6a982", medbag: true, chip: "Navy" }
  };
  const OTHERS = {
    oprf: { name: "Enemy rifleman", line: "Assault rifle and a chest rig", side: "op", weapon: "ak", head: "wrap", skin: "#b4835e", shirt: "#5d6248", pants: "#4f5560", vest: "#2e2d29", headC: "#c9bfa7", boots: "#3b3128" },

      ctx.fillRect(e.x, e.y - L * 0.03, L * 0.5, L * 0.06);
      ctx.fillStyle = "rgba(30,30,30,0.35)"; ctx.beginPath(); ctx.ellipse(e.x, e.y, L * 0.55, L * 0.55, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#f2efe6"; ctx.fillRect(e.x - L * 0.08, e.y - L * 0.02, L * 0.16, L * 0.04); ctx.fillRect(e.x - L * 0.02, e.y - L * 0.08, L * 0.04, L * 0.16);
    } else {
      ctx.fillStyle = "#cfc8b4"; ctx.fillRect(e.x - L * 0.25, e.y - L * 0.11, L * 0.5, L * 0.22);
      ctx.fillStyle = "#c0392b"; ctx.fillRect(e.x - L * 0.06, e.y - L * 0.02, L * 0.12, L * 0.04); ctx.fillRect(e.x - L * 0.02, e.y - L * 0.06, L * 0.04, L * 0.12);
    }
    flat(ctx);
  }

  // ------------------------------------------------------------------ effects during a turn
  function puff(c, x, y, rad, color) {
    onGround(ctx, c, 0);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill();
    flat(ctx);
  }
  function drawEffects(c, t, ds, a) {
    if (!P) return;
    const sp = P.speed, TR = 0.22 * sp, DUST = 0.5 * sp, minR = 3 * DPR / c.s;
    flat(ctx);
    const tw = Math.max(1.6 * DPR, 0.16 * c.s);
    for (const tr of P.tracers) {
      const dt = t - tr.t;
      if (dt < 0 || dt > TR + DUST) continue;
      if (dt <= TR) {
        const d = ds[tr.u], from = d ? muzzleAt(c, tr.u, d, a) : P3(c, tr.x0, tr.y0, 1.2), to = P3(c, tr.x, tr.y, tr.z), p = dt / TR, p0 = Math.max(0, p - 0.3);
        line(ctx, { x: lerp(from.x, to.x, p0), y: lerp(from.y, to.y, p0) }, { x: lerp(from.x, to.x, p), y: lerp(from.y, to.y, p) }, tw, COL.tracer);
      } else if (tr.miss) {
        const q = (dt - TR) / DUST;
        puff(c, tr.x, tr.y, Math.max(minR, 0.4 + q * 1.6), "rgba(118,92,58," + (0.5 * (1 - q)).toFixed(3) + ")");
      }
    }
    for (const pr of P.proj) {
      const fl = pr.fl * sp, dt = t - pr.t;
      if (dt < 0 || dt > fl) continue;
      const p = dt / fl, gx = lerp(pr.x0, pr.x1, p), gy = lerp(pr.y0, pr.y1, p), z = 1.2 + pr.arc * 4 * p * (1 - p);
      const at = P3(c, gx, gy, z), r = Math.max(2 * DPR, 0.35 * c.s);
      if (pr.rocket) {
        const from = P3(c, pr.x0, pr.y0, 1.2);
        line(ctx, from, at, Math.max(1.5 * DPR, 0.3 * c.s), "rgba(235,228,215,0.6)");
        ctx.fillStyle = "#ffd27a";
      } else {
        puff(c, gx, gy, Math.max(minR * 0.6, 0.3), "rgba(0,0,0,0.25)");
        ctx.fillStyle = "#3c3a30";
      }
      ctx.beginPath(); ctx.arc(at.x, at.y, r, 0, 7); ctx.fill();
    }
    for (const b of P.blasts) {
      const dur = 1.1 * sp, dt = t - b.t;
      if (dt < 0 || dt > dur) continue;
      const q = dt / dur, R = Math.max(b.r, 10 * DPR / c.s);
      if (q < 0.25) puff(c, b.x, b.y, R * (0.35 + q * 2), "rgba(255,190,90," + (1 - q * 3).toFixed(3) + ")");
      puff(c, b.x, b.y, R * (0.5 + q * 1.2), "rgba(110,98,82," + (0.55 * (1 - q)).toFixed(3) + ")");
    }
    for (const r of P.pulses) {
      const dur = 0.9 * sp, dt = t - r.t, d = ds[r.u];
      if (dt < 0 || dt > dur || !d) continue;
      onGround(ctx, c, 0);
      ctx.strokeStyle = "rgba(244,226,170," + (0.95 * (1 - dt / dur)).toFixed(3) + ")";
      ctx.lineWidth = 2.4 * DPR / c.s; ctx.beginPath(); ctx.arc(d.x, d.y, (c.fig * 0.35 + dt / dur * c.fig * 0.5) / c.s, 0, 7); ctx.stroke();
      flat(ctx);
    }
  }

  function draw(now) {
    if (!S.m) return;
    // t is the turn's own clock; a is real time, so figures walk and breathe at normal speed however fast the turn plays.
    const c = camera(), t = P ? P.t : now / 1000, a = now / 1000;
    S.c = c;
    taken = [];
    drawTable(c);
    drawGrid(c);
    drawObjective(c);
    drawCasevac(c, t);
    drawRoutes(c);
    drawPlaces(c);
    const ds = drawItems(c, t, a);
    drawEffects(c, t, ds, a);
    drawSmoke(c, t);
    drawTags(c, ds);
    drawMarks(c, a * 1000);
    drawTap(c);
  }

  function need() { if (!raf) raf = requestAnimationFrame(frame); }
  let last = 0;
  function frame(now) {
    raf = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (P && P.playing) {
      P.t = Math.min(P.dur + P.tail * P.speed, P.t + dt * P.speed);
      flushQueue();
      $("ptime").textContent = fmt(P.T.startStep / 10 + Math.min(P.t, P.dur));
      clockText();
      if (P.t >= P.dur + P.tail * P.speed) { draw(now); endPlayback(); return; }
    }
    draw(now);
    if (P) raf = requestAnimationFrame(frame); else last = 0;
  }

  // ------------------------------------------------------------------ playing a turn back
  function startPlayback(T) {
    const rand = rng(T.turn * 7919 + S.seed), t0 = s => (s - T.startStep) / 10;
    const tracers = [], proj = [], blasts = [], pulses = [], queue = [];
    for (const sh of T.shots) {
      if (PROJ[sh.w]) { proj.push(Object.assign({ t: t0(sh.s), x0: sh.x0, y0: sh.y0, x1: sh.x1, y1: sh.y1 }, PROJ[sh.w])); continue; }
      const n = BURST[sh.w] || 3, rate = RATE[sh.w] || 0.12, j = sh.hit ? 0.5 : 3;
      for (let k = 0; k < n; k++) tracers.push({ t: t0(sh.s) + k * rate, u: sh.u, x0: sh.x0, y0: sh.y0, x: sh.x1 + (rand() - 0.5) * 2 * j, y: sh.y1 + (rand() - 0.5) * 2 * j, z: 0.5 + rand() * 0.9, miss: !sh.hit });
    }
    const speed = S.speed;
    for (const b of T.blasts) blasts.push({ t: t0(b.s) + (PROJ[b.w] ? PROJ[b.w].fl * speed : 0), x: b.x, y: b.y, r: b.r });
    for (const r of T.radio) {
      if (r.u >= 0) pulses.push({ t: t0(r.s), u: r.u });
      const k = r.text.indexOf(": ");
      queue.push({ t: t0(r.s), e: { kind: /Man down|going under|I'm hit|Check fire/.test(r.text) ? "radio bad" : "radio", step: r.s, who: k > 0 ? r.text.slice(0, k) : "", text: k > 0 ? r.text.slice(k + 2) : r.text },
        mark: r.x != null && MARK_KIND[r.k] ? { x: r.x, y: r.y, k: r.k, step: r.s, text: r.text } : null });
    }
    const spotted = new Set();
    for (const e of T.events) {
      if (e.kind === "lost") continue;
      if (e.kind === "spotted") { if (spotted.has(e.u)) continue; spotted.add(e.u); }
      const ours = e.u >= 0 && S.roster[e.u].side === "us";
      queue.push({ t: t0(e.s), e: { kind: "event" + (ours && (e.kind === "down" || e.kind === "died") ? " bad" : ""), step: e.s, text: e.text } });
    }
    for (const r of T.rolls) if (r.big) queue.push({ t: t0(r.s), toast: r });
    for (const b of T.blown || []) queue.push({ t: t0(b.s), paint: b.cells });
    queue.sort((a, b) => a.t - b.t);
    const dur = T.frames.length ? (T.frames[T.frames.length - 1].s - T.startStep) / 10 : 60;
    const clouds = ((S.state && S.state.smoke) || []).concat(T.smoke);
    const evac0 = S.state && S.state.casevac ? S.state.casevac : null;
    P = { T, t: 0, speed, playing: true, dur, tail: 0.6, tracers, proj, blasts, pulses, queue, clouds, evac0 };
    addLog({ kind: "turn", text: "Turn " + T.turn });
    $("playbar").hidden = false;
    syncSpeed();
    $("ppause").textContent = "Pause";
    setButtons();
    need();
  }
  function flushQueue(quiet) {
    while (P.queue.length && P.queue[0].t <= P.t) {
      const q = P.queue.shift();
      if (q.mark) addMark(q.mark);
      if (q.paint) { paintCells(q.paint); continue; }
      if (q.e) addLog(q.e); else if (!quiet) toast(q.toast);
    }
  }
  function endPlayback() {
    if (!P) return;
    P.t = P.dur + 100; flushQueue(true);
    const T = P.T;
    P = null;
    S.state = T.state;
    S.rolls = T.rolls;
    paintBreaches(T.state.breaches);
    if (T.state.blown) paintCells(T.state.blown.cells);
    $("playbar").hidden = true;
    if (T.state.outcome) showOutcome(T.state);
    logDb("turns", { turn: T.turn, outcome: T.state.outcome || null, marinesDown: S.roster.filter((r, i) => r.side === "us" && T.state.units[i] && /down|dead/.test(T.state.units[i].condition)).length, shots: T.shots.length });
    clockText(); setButtons(); renderPane(); renderCard(); need();
  }
  function syncSpeed() { document.querySelectorAll("[data-speed]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.speed === S.speed))); }

  function toast(r) {
    const box = $("dice"), m = /\((\d+)%\)/.exec(r.why), need100 = m ? +m[1] : null;
    const el = document.createElement("div");
    el.className = "die" + (need100 != null ? (r.r <= need100 ? " ok" : " bad") : "");
    el.innerHTML = "<b>" + r.r + "</b><span>" + esc(r.who) + " · d" + r.d + " · " + esc(r.why) + "</span>";
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => el.remove(), 2600);
  }

  // What the enemy was really up to, told at the end.
  const GOAL_TEXT = {
    hold: "The enemy was dug in to hold the bridge.",
    delay: "The enemy was out to delay you, falling back as you came.",
    blow: "The enemy was out to blow the bridge.",
    ambush: "The enemy was lying in wait to ambush you on the bridge."
  };
  function showOutcome(st) {
    const won = st.outcome === "success", b = $("banner");

    const grades = st.objectives.secondary.map(x => "<li class=\"" + x.status + "\">" + (x.status === "met" ? "✓ " : "✗ ") + esc(x.text) + "</li>").join("")
      + (ff ? "<li class=\"failed\">✗ Friendly fire: " + ff + (ff === 1 ? " Marine" : " Marines") + " hit by our own fire</li>" : "");
    const rating = st.rating ? "<div class=\"rating\"><small>Rating</small>" + esc(st.rating) + "</div>" : "";
    const truth = GOAL_TEXT[st.enemyGoal] ? "<p>" + GOAL_TEXT[st.enemyGoal] + "</p>" : "";
    b.innerHTML = "<h2>" + (won ? "Bridge seized" : "Mission failed") + "</h2>" + rating + "<p>" + esc(st.outcomeText) + "</p>" + truth + "<ul class=\"grades\">" + grades + "</ul><button class=\"btn primary small\" type=\"button\" id=\"againBtn\">New map</button>";

  // ------------------------------------------------------------------ the net, the squad, the brief, the dice
  function addLog(e) {
    if (e.step == null) e.step = S.state ? S.state.step : 0;

    if (S.tab === "net") renderPane(true);
  }
  function clockText() {
    if (!S.state) return;

  }
  function droneRow() {
    const i = S.roster.findIndex(r => r.figure === "drone");

      + (u && !u.gone ? "Up over " + esc(u.grid) : "In its case") + "</span></div></div>";
  }
  function hurtText(u) {

  function renderPane(keepBottom) {

          const u = S.state.units[i];

          const kit = [u.launcher || u.launcherAp ? "M320 " + u.launcher + " HE, " + u.launcherAp + " AP" : "", u.grenades ? u.grenades + " gren" : "", u.smokes ? u.smokes + " smoke" : ""].filter(Boolean);

            + "<span class=\"n\">" + esc(r.name) + " <small>" + esc(ROLE[r.figure] || r.kind) + "</small></span><span class=\"a\">" + u.ammo + " rds</span>"

  const MARKS = { ok: "○", met: "✓", failed: "✗", notyet: "○", onit: "◉", seized: "✓" };

  function quickBriefHtml() {

  function previewHtml() {
    const pd = S.pending;
    if (S.reading) return "<div class=\"preview\" style=\"margin-top:10px\"><div class=\"ocard\"><span class=\"empty\">Reading your orders…</span></div></div>";
    if (!pd) return "";
    const r = pd.read, out = [];
    r.orders.forEach((o, i) => {

      const rb = r.readbacks.find(x => x.who && x.who.toLowerCase() === o.who.toLowerCase());
      const blanks = [o.where, o.target, o.speed, o.posture, o.kind, o.swim ? "swim" : null].filter(Boolean).join(" · ");
      out.push("<div class=\"ocard\"><span class=\"h\">" + esc(o.who) + " · " + esc(o.verb) + (blanks ? "<small>" + esc(blanks) + "</small>" : "") + "</span>"
        + (rb ? "<span class=\"rb\">" + esc(rb.text) + "</span>" : "")
        + "<ul>" + checks.map(c => {
          const nm = c.u >= 0 ? S.roster[c.u].name : c.who;
          if (!c.ok) return "<li class=\"no\">" + esc(nm) + ": " + esc(/^not covered/.test(c.problem || "") ? "Not covered yet: " + o.verb : c.problem) + "</li>";
          return "<li class=\"ok\">" + esc(nm) + (c.meters != null ? ", " + Math.round(c.meters) + " m" : "") + "</li>" + c.warnings.map(w => "<li class=\"warn\">" + esc(w) + "</li>").join("");
        }).join("") + "</ul></div>");
    });
    r.sayAgain.forEach(s => out.push("<div class=\"ocard say\"><span class=\"rb\">" + esc(s) + "</span></div>"));
    r.notCovered.forEach(n => out.push("<div class=\"ocard nc\"><span class=\"h\">Not covered yet<small>" + esc(n.who || "") + "</small></span><span class=\"empty\">" + esc(n.text) + ". Saved so it can be built.</span></div>"));
    if (!out.length) out.push("<div class=\"ocard say\"><span class=\"rb\">Lead, say again? No orders came through.</span></div>");
    const ok = pd.checks.some(c => c.ok);
    return "<div class=\"preview\" style=\"margin-top:10px\"><h3 class=\"mini\">Orders ready" + (pd.reader === "simple" ? " · read by the simple reader" : " · read by Haiku") + "</h3>" + out.join("")
      + "<span class=\"empty\">" + (ok ? "Play turn sends the ✓ orders and plays one minute. Type new orders to replace these." : "Nothing here can be carried out. Type new orders, or play the turn as things stand.") + "</span></div>";
  }

  function renderCard() {
    const card = $("card");
    if (P || !S.m) { card.hidden = true; return; }
    if (S.sel >= 0) {
      const r = S.roster[S.sel], u = S.state.units[S.sel];
      if (!u) { card.hidden = true; return; }
      if (r.side === "us") {
        card.innerHTML = "<span class=\"nm\">" + esc(r.name) + "</span><span class=\"meta\">" + esc(ROLE[r.figure] || r.kind) + (r.team ? ", " + esc(r.team) : "") + " · " + esc(u.grid) + "<br>"
          + esc(hurtText(u)) + " · " + u.ammo + " rds" + (u.launcher || u.launcherAp ? " · M320 " + u.launcher + " HE, " + u.launcherAp + " AP" : "") + (u.grenades ? " · " + u.grenades + " grenades" : "") + (u.smokes ? " · " + u.smokes + " smoke" : "")
          + "<br>" + esc(u.order ? "Now: " + orderText(u.order) : "No orders") + "</span><div class=\"row\"><button type=\"button\" class=\"primary\" data-say=\"" + esc(r.name) + ", \">Order " + esc(r.name) + "</button>"
          + (r.team ? "<button type=\"button\" data-say=\"" + esc(r.team) + ", \">Order " + esc(r.team) + "</button>" : "") + "</div>";
      } else {
        const age = Math.max(0, Math.round((S.state.step - (u.lastSeen || 0)) / 600));
        card.innerHTML = "<span class=\"nm\">" + esc(r.name) + "</span><span class=\"meta\">" + (u.seen ? "Seen now at " + esc(u.grid) + (u.detained ? ", detained" : u.condition && u.condition !== "ok" ? ", " + esc(u.condition) : "") : "Last seen " + (age < 1 ? "just now" : age + " min ago") + " at " + esc(u.grid)) + "</span>"
          + "<div class=\"row\"><button type=\"button\" class=\"primary\" data-say=\"" + esc(r.name) + "\">Use as target</button></div>";
      }
      card.hidden = false;
      return;
    }
    if (S.tap) {
      // Tapping the map gives its six-digit coordinates, ready to drop into an order.
      const t = S.tap, at = coordOf(t.x, t.y), named = !t.mark && t.name !== t.grid;
      card.innerHTML = "<span class=\"nm\">" + esc(t.name) + "</span><span class=\"meta\">" + (t.mark ? esc(markLine(t.mark)) + "<br>" : "") + esc(t.grid) + " · " + at + " · " + esc(t.ground) + "</span><div class=\"row\">"
        + (named ? "<button type=\"button\" class=\"primary\" data-say=\"" + esc(t.name) + "\">Use " + esc(t.name) + "</button>" : "")
        + "<button type=\"button\"" + (named ? "" : " class=\"primary\"") + " data-say=\"" + at + "\">Use " + at + "</button>"
        + "<button type=\"button\" data-say=\"" + esc(t.grid) + "\">Use " + esc(t.grid) + "</button></div>";
      card.hidden = false;
      return;
    }
    card.hidden = true;
  }

  // ------------------------------------------------------------------ taps, drags, pinches
  const gridOf = (x, y) => String.fromCharCode(65 + clamp(Math.floor(x / S.sq), 0, 25)) + (clamp(Math.floor(y / S.sq), 0, 98) + 1);
  // Six-digit coordinates: meters east from the west edge, then meters north from the south edge, like "452 287".
  const coordOf = (x, y) => [x, S.mh - y].map(v => String(clamp(Math.floor(v), 0, 999)).padStart(3, "0")).join(" ");
  function groundName(x, y) {
    const cx = clamp((x / S.cell) | 0, 0, S.cw - 1), cy = clamp((y / S.cell) | 0, 0, S.chh - 1);
    const t = S.map.terrains[S.cells[cy * S.cw + cx]];
    return t ? t.name : "";
  }
  function tapAt(sx, sy) {
    const c = S.c;
    if (!c || P) return;
    const pin = markAt(sx, sy);
    if (pin) {
      S.sel = -1;
      S.tap = { x: pin.x, y: pin.y, name: (MARK_KIND[pin.k] || MARK_KIND.info).name, grid: gridOf(pin.x, pin.y), ground: groundName(pin.x, pin.y), mark: pin };
      renderCard(); need(); return;
    }
    let best = -1, bd = 1e9;
    for (let i = 0; i < S.roster.length; i++) {
      const d = fromState(i);
      if (!d || isDrone(i)) continue;
      const f = P3(c, d.x, d.y, 0), fig = c.fig;
      if (sx > f.x - fig * 0.38 && sx < f.x + fig * 0.38 && sy > f.y - fig && sy < f.y + fig * 0.15) {
        const dist = Math.abs(sx - f.x) + Math.abs(sy - (f.y - fig * 0.45)) - d.y * 0.001;
        if (dist < bd) { bd = dist; best = i; }
      }
    }
    if (best >= 0) { S.sel = best; S.tap = null; renderCard(); if (S.tab === "squad") renderPane(); need(); return; }
    S.sel = -1;
    for (const b of S.map.buildings) {
      const a = P3(c, b.x, b.y, b.z), z = P3(c, b.x + b.w, b.y + b.h, 0);
      if (sx >= a.x && sx <= z.x && sy >= a.y && sy <= z.y) {
        S.tap = { x: b.x + b.w / 2, y: b.y + b.h / 2, name: b.label, grid: gridOf(b.x + b.w / 2, b.y + b.h / 2), ground: "Stone building" };
        renderCard(); need(); return;
      }
    }
    const mx = (sx - c.e) / c.s, my = (sy - c.f) / (c.s * K);
    if (mx < 0 || my < 0 || mx >= S.mw || my >= S.mh) { S.tap = null; renderCard(); need(); return; }
    const o = S.m.objective, onObj = Math.hypot(mx - o.x, my - o.y) < 18;
    S.tap = { x: mx, y: my, name: onObj ? o.label : gridOf(mx, my), grid: gridOf(mx, my), ground: groundName(mx, my) };
    renderCard(); need();
  }

  const ptrs = new Map();
  let pinch = null, dragged = false;
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.offsetX * DPR, y: e.offsetY * DPR });
    dragged = ptrs.size > 1;
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: S.cam.s };
    }
  });
  cv.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId);
    if (!p) {
      // A mouse resting on a pin shows its call.
      const h = e.pointerType === "mouse" ? markAt(e.offsetX * DPR, e.offsetY * DPR) : null;
      if (h !== S.hover) { S.hover = h; cv.style.cursor = h ? "pointer" : ""; need(); }
      return;
    }
    const x = e.offsetX * DPR, y = e.offsetY * DPR;
    if (ptrs.size === 1) {
      const dx = x - p.x, dy = y - p.y;
      if (!dragged && Math.hypot(dx, dy) < 7 * DPR) return;
      dragged = true;
      S.cam.x -= dx / S.cam.s; S.cam.y -= dy / (S.cam.s * K);
      clampCam(); p.x = x; p.y = y; need();
    } else if (ptrs.size === 2 && pinch) {
      p.x = x; p.y = y;
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.s * d / pinch.d) / S.cam.s);
    }
  });
  const up = e => {
    const p = ptrs.get(e.pointerId);
    if (p && ptrs.size === 1 && !dragged) tapAt(e.offsetX * DPR, e.offsetY * DPR);
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
  };
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", e => { ptrs.delete(e.pointerId); pinch = null; });
  cv.addEventListener("pointerleave", () => { if (S.hover) { S.hover = null; cv.style.cursor = ""; need(); } });
  cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.offsetX * DPR, e.offsetY * DPR, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  $("zin").onclick = () => zoomAt(cv.width / 2, cv.height / 2, 1.6);
  $("zout").onclick = () => zoomAt(cv.width / 2, cv.height / 2, 1 / 1.6);
  $("zfit").onclick = fit;

  function resize() {
    const box = $("tableBox"), wasFit = Math.abs(S.cam.s - S.fitS) < 1e-6;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(box.clientWidth * DPR));
    cv.height = Math.max(1, Math.round(box.clientHeight * DPR));
    S.fitS = fitScale();
    if (wasFit || S.cam.s < S.fitS * 0.85) fit(); else need();
  }
  new ResizeObserver(resize).observe($("tableBox"));

  // ------------------------------------------------------------------ the order box
  const box = $("orderBox");
  function autosize() {
    box.style.height = "44px";
    if (box.value) box.style.height = Math.min(120, Math.max(44, box.scrollHeight + 2)) + "px";
  }
  box.addEventListener("input", () => { autosize(); setButtons(); });
  box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  function insert(text) {
    const a = box.selectionStart ?? box.value.length, b = box.selectionEnd ?? box.value.length, before = box.value.slice(0, a);
    const pad = before && !/\s$/.test(before) ? " " : "";
    box.value = before + pad + text + box.value.slice(b);
    const at = (before + pad + text).length;
    box.focus(); box.setSelectionRange(at, at); autosize(); setButtons();
  }
  $("card").addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) insert(b.dataset.say); });
  $("pane").addEventListener("click", e => {
    const m = e.target.closest(".mate");
    if (!m || m.dataset.u == null) return;
    const i = +m.dataset.u, u = S.state.units[i];
    S.sel = i; S.tap = null;
    if (u) lookAt(u.x, u.y, 46);
    renderCard(); renderPane();
  });
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderPane(); if (S.tab !== "net") $("pane").scrollTop = 0; });
  $("orderForm").addEventListener("submit", e => { e.preventDefault(); send(); });
  $("playBtn").onclick = () => playTurn();
  $("ppause").onclick = () => { if (!P) return; P.playing = !P.playing; $("ppause").textContent = P.playing ? "Pause" : "Play"; last = 0; need(); };
  $("pskip").onclick = () => { if (P) { P.t = P.dur + P.tail * P.speed; endPlayback(); } };
  document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => { S.speed = +b.dataset.speed; if (P) P.speed = S.speed; syncSpeed(); });

  function setButtons() {
    const live = !!S.m && !P && !S.busy && !(S.state && S.state.outcome);
    $("sendBtn").disabled = !live || !box.value.trim();
    $("playBtn").disabled = !live;
    box.disabled = !S.m || !!(S.state && S.state.outcome);
  }

  // ------------------------------------------------------------------ reading orders: Haiku, or a simple reader when Haiku isn't available
  const caps = { sample: null, db: null, reader: "starting" };
  (async () => {
    try { caps.sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { caps.sample = null; }
    caps.reader = caps.sample ? "haiku" : "simple";
    if (S.tab === "brief") renderPane();
  })();
  (async () => {
    try { caps.db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { caps.db = null; }
  })();
  function readerNote() {
    if (caps.reader === "haiku") return "Haiku reads your orders. The first time, Claude asks you to allow it.";
    if (caps.reader === "off") return "Haiku isn't allowed in this view, so a simple built-in reader takes your orders. It knows who, the verbs, grid squares, and place names.";
    if (caps.reader === "simple") return "Haiku isn't available in this view, so a simple built-in reader takes your orders. It knows who, the verbs, grid squares, and place names.";
    return "Checking whether Haiku can read your orders.";
  }
  async function logDb(coll, data) {
    try { if (caps.db) await caps.db.collection(coll).add(Object.assign({ at: new Date().toISOString(), seed: S.seed, title: S.m ? S.m.title : "" }, data)); } catch (e) { /* the log is a nice-to-have */ }
  }

  const VERB_HELP = [
    "- move: go to a place. where (required). speed: \"walk\", \"run\", or \"crawl\" if said. swim: true only if told to swim.",
    "- assault: attack and move through a place or contact. where or target.",
    "- hold: stay put and fight from there.",
    "- fire: shoot at a contact or a place. target (a contact name) or where. kind \"HE\" or \"AP\" when they name the grenade launcher round.",
    "- suppress: keep fire on a contact or a place to pin it down. target or where.",
    "- take cover: get into the best cover nearby.",
    "- hide: get low and out of sight nearby.",
    "- change posture: posture \"stand\", \"kneel\", or \"prone\" (get down means prone).",
    "- withdraw: fall back. where if given; without it they fall back the way they came.",
    "- follow: follow another Marine or team. target is who to follow.",
    "- observe: watch a place or contact. where or target.",
    "- report: report what they see.",
    "- treat casualty: give first aid. target is the casualty's name, if given.",
    "- throw grenade: a hand grenade, 35 meters at most. where or target.",
    "- drop: drop heavy gear, needed before swimming deep water.",
    "- emote: kind, like \"dance\", \"salute\", or \"wave\".",
    "- bound: move by rushes, half the team covering while the other half runs. where (required).",
    "- overwatch: cover an area and shoot whatever shows up there. target: the area or contact to watch. where: a spot to watch from, only if they give one.",
    "- throw smoke: a smoke grenade to screen, 35 meters at most. where, if given.",
    "- clear: go through a building room by room. where: the building.",
    "- breach: open a gap in a wall, hedge, or building. where.",
    "- fly drone: only for the drone operator. where: where to send the drone. Leave where out to bring it back and pack it up.",
    "- talk: talk to a civilian or a prisoner. target: who.",
    "- search: search a place, or a person who is down, detained, or a civilian. target (a person) or where.",
    "- carry: carry a casualty. target: who to carry. where: where to take them.",
    "- detain: take someone prisoner: a civilian, or an enemy who is down. target: who.",
    "- share ammo: spread the ammo out evenly across a team.",
    "- request: call for CASEVAC. kind \"CASEVAC\". where: the landing zone."
  ].join("\n");
  const SHAPE = '{"orders": [{"who": "Alpha", "verb": "move", "where": "building 4", "target": null, "speed": "run", "posture": null, "swim": false, "kind": null}],\n "readbacks": [{"who": "Alpha", "text": "Alpha, moving to building 4."}],\n "sayAgain": ["Bravo: Say again, which building?"],\n "notCovered": [{"who": "Charlie", "text": "fly the drone over the village"}]}';
  function buildPrompt(text) {
    const L = [], st = S.state.units;
    L.push("You read radio orders for Field Table, a squad tactics game. The player is the squad leader (\"Lead\") of a Marine rifle squad. Turn what the player said into orders the game can run.");
    L.push("", "Reply with only JSON, in this shape:", SHAPE);
    L.push("", "WHO: use exactly one of \"squad\" (everyone), a team (\"Alpha\", \"Bravo\", or \"Charlie\"), or one Marine by last name. The squad:");
    S.roster.forEach((r, i) => {
      if (r.side !== "us" || isDrone(i)) return;
      const u = st[i];
      if (u.gone) { L.push("- " + r.name + ": evacuated, not here"); return; }
      const kit = (r.figure === "tl" ? ", M320 with " + u.launcher + " HE and " + u.launcherAp + " AP" : "") + (r.figure === "dr" ? ", flies the squad's drone" : "") + (r.figure === "doc" ? ", the medic" : "");
      L.push("- " + r.name + ": " + (ROLE[r.figure] || r.kind).toLowerCase() + (r.team ? ", " + r.team : "") + kit + " (also called " + r.calls.join(", ") + "), at " + u.grid + (u.condition !== "ok" || u.legHit || u.armHit ? ", " + hurtText(u) : "") + (u.order ? ", now doing: " + orderText(u.order) : ""));
    });
    L.push("", "VERBS: use exactly one of these per order, with the blanks shown:", VERB_HELP);
    L.push("", "WHERE: a grid square (columns A to " + String.fromCharCode(64 + S.map.cols) + ", rows 1 to " + S.map.rows + ", 100 meters each, like \"E3\"), a place below written exactly as shown, six-digit coordinates written like \"452 287\" (meters east, then meters north), a Marine or team name, or a kind of ground in a square, written like \"woods at C3\" (woods, field, crops, reeds, scrub, orchard, hedge, wall, rocks, gully, road, trail, creek, building, farmyard, cliff, bridge).", "PLACES:");
    S.map.places.forEach(p => { if (p.kind !== "control") L.push("- " + p.label + " (" + p.grid + ")" + (p.note ? ", " + p.note : "")); });
    S.map.buildings.forEach(b => L.push("- " + b.label + " (" + gridOf(b.x + b.w / 2, b.y + b.h / 2) + ")"));
    L.push("", "GROUND IN EACH SQUARE, most first:");
    (S.squareGround || []).forEach(line => L.push("- " + line));
    L.push("", "CONTACTS the squad has seen. Use these names for target:");
    let any = false;
    S.roster.forEach((r, i) => {
      const u = st[i];
      if (r.side === "us" || !u) return;
      any = true;
      const age = Math.max(0, Math.round((S.state.step - (u.lastSeen || 0)) / 600));
      L.push("- " + r.name + " (" + (r.side === "civ" ? "civilian" : "enemy") + "): " + (u.seen ? "seen now at " + u.grid : "last seen " + (age < 1 ? "just now" : age + " min ago") + " at " + u.grid));
    });
    if (!any) L.push("- none yet");
    L.push("", "RULES:",
      "- Use the smallest who that fits: a team when the player names a team, one Marine when they name one Marine.",
      "- \"On me\" or \"to me\" means where Lead is: where \"Lead\".",
      "- A Marine or team and a place with no verb, like \"Charlie, C3\", means move there.",
      "- When they name ground and a square, like \"the woods at C3\", use that as where, and check the square really has it.",
      "- Six-digit coordinates, like \"452 287\" or \"452287\", are a where: write them as \"452 287\".",
      "- Leave out blanks the player didn't give. Don't make up places, Marines, or contacts. If a place or name isn't in the lists, add a short line to sayAgain in a Marine's voice instead, like \"Bravo: Say again, which building?\"",
      "- If the player asks for something none of the verbs cover, add it to notCovered with who and a plain summary, and leave it out of orders.",
      "- readbacks: one short line per order in a Marine's radio voice, from whoever got it.",
      "- Keep the player's meaning. Don't add orders the player didn't give.");
    L.push("", "THE ORDERS, as the player gave them:", "\"\"\"" + text + "\"\"\"");
    return L.join("\n");
  }
  function cleanRead(r) {
    const out = { orders: [], readbacks: [], sayAgain: [], notCovered: [] };
    if (!r || typeof r !== "object") return out;
    const str = v => typeof v === "string" && v.trim() ? v.trim() : undefined;
    (Array.isArray(r.orders) ? r.orders : []).forEach(o => {
      if (!o || !str(o.who) || !str(o.verb)) return;
      const c = { who: str(o.who), verb: str(o.verb).toLowerCase() };
      for (const k of ["where", "target", "speed", "posture", "kind"]) if (str(o[k])) c[k] = str(o[k]);
      if (o.swim === true) c.swim = true;
      out.orders.push(c);
    });
    (Array.isArray(r.readbacks) ? r.readbacks : []).forEach(x => { if (x && str(x.text)) out.readbacks.push({ who: str(x.who) || "", text: str(x.text) }); else if (str(x)) out.readbacks.push({ who: "", text: str(x) }); });
    (Array.isArray(r.sayAgain) ? r.sayAgain : []).forEach(x => { if (str(x)) out.sayAgain.push(str(x)); });
    (Array.isArray(r.notCovered) ? r.notCovered : []).forEach(x => { if (x && str(x.text)) out.notCovered.push({ who: str(x.who) || "", text: str(x.text) }); else if (str(x)) out.notCovered.push({ who: "", text: str(x) }); });
    return out;
  }

  // The simple reader: who, a verb by its everyday words, then a place, a grid square, or a contact.
  const WORDS = [
    ["request", /\b(casevac|medevac|dustoff|9.?line)\b/], ["fly drone", /\b(drone|quadcopter|quad)\b/], ["throw smoke", /\bsmoke\b/],
    ["share ammo", /\b(share|redistribute|spread)\b.*\bammo\b/], ["throw grenade", /\b(grenade|frag)\b/], ["carry", /\b(carry|drag|haul)\b/],
    ["treat casualty", /\b(treat|patch|first aid|aid)\b/], ["overwatch", /\b(overwatch|provide cover|cover (us|me|them))\b/], ["take cover", /\b(take cover|get to cover|cover)\b/],
    ["detain", /\b(detain|zip.?tie|cuff|take .* prisoner)\b/], ["talk", /\b(talk|ask|question|interview)\b/], ["search", /\b(search|look for|sweep)\b/],
    ["breach", /\b(breach|blow (a|the) hole)\b/], ["clear", /\bclear\b/], ["bound", /\b(bound|bounding|leapfrog)\b/],
    ["hide", /\bhide\b/], ["withdraw", /\b(withdraw|fall back|pull back|retreat)\b/], ["suppress", /\bsuppress/], ["assault", /\b(assault|attack|storm)\b/],
    ["fire", /\b(fire|engage|shoot|light up)\b/], ["follow", /\bfollow\b/], ["observe", /\b(observe|watch|eyes on)\b/], ["report", /\breport\b/],
    ["drop", /\b(drop|ditch)\b.*\b(gear|kit|packs?)\b/], ["emote", /\b(dance|salute|wave)\b/], ["change posture", /\b(get down|go prone|prone|kneel|stand up)\b/],
    ["hold", /\b(hold|stay|halt|stop|freeze)\b/], ["move", /\b(move|go|run|rush|sprint|crawl|head|push|get to|cross)\b/]
  ];
  function localRead(text) {
    const out = { orders: [], readbacks: [], sayAgain: [], notCovered: [] };
    const names = [];
    S.roster.forEach(r => { if (r.side === "us" && r.figure !== "drone") { names.push([r.name, r.name]); r.calls.forEach(c => names.push([c, r.name])); if (r.team) names.push([r.team, r.team]); } });
    names.push(["squad", "squad"], ["everyone", "squad"], ["all", "squad"]);
    names.sort((a, b) => b[0].length - a[0].length);
    const places = S.map.places.map(p => p.label).concat(S.map.buildings.map(b => b.label)).sort((a, b) => b.length - a.length);
    const contacts = S.roster.filter((r, i) => r.side !== "us" && S.state.units[i]).map(r => r.name).sort((a, b) => b.length - a.length);
    let who = null;
    for (const raw of text.split(/[.;\n!?]+/)) {
      const s = raw.trim(), lo = s.toLowerCase();
      if (!s) continue;
      const w = names.find(([n]) => new RegExp("(^|\\W)" + n.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\W|$)").test(lo));
      if (w) who = w[1];
      if (!who) { out.sayAgain.push("Say again, who is that for?"); continue; }
      const place = places.find(p => lo.includes(p.toLowerCase()));
      const grid = /\b([a-z])\s?([1-9])\b/i.exec(s.replace(/\b(a|i)\b/gi, ""));
      const coords = /\b(\d{3})\s*[-\/]?\s*(\d{3})\b/.exec(s);
      // A Marine or team and a place with no verb means move there.
      const verb = (WORDS.find(([, re]) => re.test(lo)) || [])[0] || (place || grid || coords ? "move" : null);
      if (!verb) { out.sayAgain.push(who + ": Say again, what do you want us to do?"); continue; }
      const o = { who, verb };
      const ground = /\b(woods|forest|trees|tree ?line|orchard|fields?|crops|corn|reeds|marsh|scrub|brush|hedge(row)?|wall|rocks|gully|ditch|road|trail|creek|building|farmyard|cliff)\s+(in|at|on)\s+([a-h])\s?([1-9])\b/i.exec(s);
      const contact = contacts.find(n => lo.includes(n.toLowerCase())) || (/\b(pkm|machine gun|gunner)\b/.test(lo) && contacts.find(n => /PKM/.test(n))) || (/\brpg\b/.test(lo) && contacts.find(n => /RPG/.test(n)));
      if (/\b(on me|to me)\b/.test(lo)) o.where = "Lead";
      else if (coords) o.where = coords[1] + " " + coords[2];
      else if (ground) o.where = ground[1].toLowerCase() + " at " + ground[4].toUpperCase() + ground[5];
      else if (place) o.where = place;
      else if (grid) o.where = grid[1].toUpperCase() + grid[2];
      if (contact && !(verb === "move" && o.where)) o.target = contact;
      if (verb === "follow") { const f = names.find(([n]) => n.toLowerCase() !== who.toLowerCase() && lo.includes(n.toLowerCase())); if (f) o.target = f[1]; }
      if (/\b(run|rush|sprint)\b/.test(lo)) o.speed = "run"; else if (/\bcrawl\b/.test(lo)) o.speed = "crawl";
      if (verb === "change posture") o.posture = /kneel/.test(lo) ? "kneel" : /stand/.test(lo) ? "stand" : "prone";
      if (verb === "emote") o.kind = (/\b(dance|salute|wave)\b/.exec(lo) || [])[1];
      if (verb === "request") o.kind = "CASEVAC";
      if (/\bHE\b/.test(s)) o.kind = "HE"; else if (/\bAP\b/.test(s)) o.kind = "AP";
      if (verb === "carry") { const c = names.find(([n]) => n.toLowerCase() !== who.toLowerCase() && lo.includes(n.toLowerCase())); if (c) o.target = c[1]; }
      if (verb === "fly drone" && /\b(back|home|land|pack)\b/.test(lo)) delete o.where;
      if (/\bswim\b/.test(lo)) o.swim = true;
      out.orders.push(o);
      out.readbacks.push({ who, text: who + ", " + verb + (o.where ? ", " + o.where : o.target ? ", " + o.target : "") + ", wilco." });
    }
    return out;
  }

  async function send() {
    const text = box.value.trim();
    if (!text || S.busy || P || !S.m || S.state.outcome) return;
    S.busy = true; S.reading = true; S.pending = null; setButtons();
    S.tab = "net";
    addLog({ kind: "you", who: "Lead", text });
    box.value = ""; autosize();
    renderPane();
    let read = null, reader = "simple", note = null;
    if (caps.sample) {
      try { read = await caps.sample.json(buildPrompt(text), { model: "claude-haiku-5-5", modelTier: "quick" }); reader = "haiku"; }
      catch (e) {
        const code = e && e.code;
        if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") { caps.sample = null; caps.reader = "off"; note = "Haiku isn't allowed here, so the simple reader took these orders."; }
        else if (code === "rate_limited") note = "Haiku is busy right now, so the simple reader took these orders.";
        else note = "Haiku couldn't read that (" + (code || "error") + "), so the simple reader took it.";
      }
    }
    if (!read) read = localRead(text);
    read = cleanRead(read);
    if (note) addLog({ kind: "event warn", text: note });
    let checks = [];
    try { if (read.orders.length) checks = (await call("CheckOrders", JSON.stringify(read.orders))).checks; }
    catch (e) { addLog({ kind: "event bad", text: "The simulation couldn't check those orders: " + e.message }); }
    S.pending = { text, read, checks, reader };
    S.reading = false; S.busy = false;
    logDb("orders", { turn: S.state.turn, text, reader, orders: read.orders, sayAgain: read.sayAgain, notCovered: read.notCovered, problems: checks.filter(c => !c.ok).map(c => c.problem) });
    setButtons(); renderPane(); need();
  }

  async function playTurn() {
    if (S.busy || P || !S.m || S.state.outcome) return;
    if (box.value.trim() && !S.pending) { await send(); addLog({ kind: "event", text: "Check the orders, then press Play turn." }); return; }
    S.busy = true; setButtons();
    S.sel = -1; S.tap = null; renderCard();
    try {
      const pd = S.pending;
      if (pd) {
        const okOrders = pd.read.orders.filter((o, i) => pd.checks.some(c => c.order === i && c.ok));
        if (okOrders.length) {
          const g = await call("GiveOrders", JSON.stringify(okOrders));
          S.state = g.state;
        }
        pd.read.orders.forEach((o, i) => {
          const cs = pd.checks.filter(c => c.order === i);
          if (cs.some(c => c.ok)) {
            const rb = pd.read.readbacks.find(x => x.who && x.who.toLowerCase() === o.who.toLowerCase());
            addLog({ kind: "radio", who: rb ? rb.who : o.who, text: rb ? rb.text.replace(new RegExp("^" + rb.who.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[,:]\\s*", "i"), "") : "Wilco." });
          } else {
            const bad = cs.find(c => c.problem);
            if (bad) addLog({ kind: "radio warn", who: o.who, text: /^not covered/.test(bad.problem) ? "We can't do that yet: " + o.verb + "." : bad.problem });
          }
        });
        pd.read.sayAgain.forEach(s => addLog({ kind: "radio warn", who: "", text: s }));
        S.pending = null;
      }
      const T = await call("RunTurn");
      S.busy = false;
      startPlayback(T);
    } catch (e) {
      S.busy = false;
      addLog({ kind: "event bad", text: "The turn didn't run: " + e.message });
      setButtons();
    }
  }

  // ------------------------------------------------------------------ starting up
  const randomSeed = () => 10000 + Math.floor(Math.random() * 90000);
  function bootMsg(text, failed) {
    $("boot").hidden = false;
    $("bootMsg").textContent = text;
    document.querySelector("#boot .bar").hidden = !!failed;
  }
  async function newMission(seed) {
    bootMsg("Building map " + seed + ".");
    $("banner").hidden = true;
    P = null; $("playbar").hidden = true;
    await new Promise(r => setTimeout(r, 30));
    try {
      const m = await call("NewMission", S.data.t, S.data.u, S.data.n, seed);
      S.m = m; S.seed = seed; S.map = m.map; S.roster = m.roster; S.state = m.state;
      S.mw = m.map.w * m.map.cell; S.mh = m.map.h * m.map.cell; S.sq = m.map.square;
      S.log = []; S.rolls = []; S.flip = {}; S.sel = -1; S.tap = null; S.marks = []; S.hover = null; S.pending = null; S.busy = false;
      buildGround(m.map);
      S.breaches = 0; S.painted = 0;
      squareGround(m.map);
      $("title").textContent = m.title;
      document.title = "Field Table Playtest";
      $("boot").hidden = true;
      S.tab = "brief"; S.briefMode = "quick";
      frameStart(); clockText(); setButtons(); renderPane(); renderCard();
    } catch (e) {
      bootMsg("The map didn't build: " + e.message, true);
    }
  }
  async function boot() {
    try {
      // Artifact paths can't start with "_", so the files live in framework/ instead of _framework/.
      await Blazor.start({ loadBootResource: (type, name, defaultUri) => defaultUri.replace("_framework/", "framework/") });
      const files = await Promise.all(["terrain.json", "units.json", "names.json"].map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f + " is missing"); return r.text(); })));
      S.data = { t: files[0], u: files[1], n: files[2] };
      await newMission(randomSeed());
    } catch (e) {
      bootMsg("The simulation didn't load: " + (e && e.message ? e.message : e) + ". Reload the page to try again.", true);
    }
  }
  const loader = document.createElement("script");
  loader.src = "framework/blazor.webassembly.js";
  loader.setAttribute("autostart", "false");
  loader.onload = boot;
  loader.onerror = () => bootMsg("Couldn't load the simulation files. Reload the page to try again.", true);
  document.body.appendChild(loader);
  renderPane();
  resize();
})();
</script>
